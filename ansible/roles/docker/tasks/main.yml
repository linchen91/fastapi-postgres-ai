---
- name: Check whether Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_version_check
  changed_when: false
  failed_when: false

- name: Install Docker packages (Debian family)
  ansible.builtin.apt:
    name: "{{ docker_packages_debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_os_family == "Debian"
    - docker_version_check.rc != 0
    - ansible_connection != "local"

- name: Install Docker packages (RedHat family)
  ansible.builtin.dnf:
    name: "{{ docker_packages_redhat }}"
    state: present
  when:
    - ansible_os_family == "RedHat"
    - docker_version_check.rc != 0
    - ansible_connection != "local"

- name: Ensure docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: ansible_connection != "local"

- name: Ensure deployment user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
  when: ansible_connection != "local"

- name: Add deployment user to docker group
  ansible.builtin.user:
    name: "{{ app_user }}"
    groups: docker
    append: true
  when: ansible_connection != "local"
