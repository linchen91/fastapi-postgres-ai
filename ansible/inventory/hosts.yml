---
all:
  children:
    # Deploy targets: hosts that receive the Docker Compose stack.
    app:
      hosts:
        app-server:
          ansible_host: 127.0.0.1
          ansible_connection: local
          # Privilege escalation: local runs as invoking user (docker group), no sudo password.
          ansible_become: false
          app_root: "{{ lookup('env', 'HOME') }}/fastapi-postgres-ai"
    # Used only by the offline test playbook (no SSH, connection: local).
    local:
      hosts:
        localhost:
          ansible_connection: local
