---
all:
  children:
    # Deploy targets: hosts that receive the Kubernetes stack (Terraform-managed).
    app:
      hosts:
        app-server:
          ansible_host: 127.0.0.1
          ansible_connection: local
          ansible_become: false
          app_root: "{{ lookup('env', 'HOME') }}/TS/fastapi-postgres-ai"
    # Used only by the offline test playbook (no SSH, connection: local).
    local:
      hosts:
        localhost:
          ansible_connection: local
