---
- name: Offline configuration assertions (no hosts, cluster, or secrets required)
  hosts: local
  gather_facts: false
  vars:
    deploy_playbook: "{{ playbook_dir }}/deploy.yml"
    app_tasks_file: "{{ playbook_dir }}/../roles/app/tasks/main.yml"
    k8s_tasks_file: "{{ playbook_dir }}/../roles/k8s/tasks/main.yml"
  tasks:
    - name: Load secret placeholder defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/vault.yml.example"

    - name: Assert group_vars match the deployment contract
      ansible.builtin.assert:
        that:
          - app_name == 'fastapi-postgres-ai'
          - app_root == '/opt/fastapi-postgres-ai'
          - app_version == 'main'
          - app_user == 'deploy'
          - api_port | int == 8001
          - app_repo is defined
        success_msg: "group_vars/all.yml matches the deployment contract"
        fail_msg: "group_vars/all.yml deviates from the expected contract"

    - name: Assert vault placeholders cover the Terraform variable contract
      ansible.builtin.assert:
        that:
          - secret_key is defined
          - postgres_user is defined
          - postgres_password is defined
          - postgres_db is defined
          - openrouter_api_key is defined
          - openrouter_model is defined
          - openrouter_url is defined
          - tavily_api_key is defined
        success_msg: "vault.yml.example defines every secret Terraform requires"
        fail_msg: "vault.yml.example must define all TF_VAR_* inputs used by the app role"

    - name: Read deploy playbook and role task files
      ansible.builtin.set_fact:
        deploy_content: "{{ lookup('ansible.builtin.file', deploy_playbook) }}"
        app_tasks_content: "{{ lookup('ansible.builtin.file', app_tasks_file) }}"
        k8s_tasks_content: "{{ lookup('ansible.builtin.file', k8s_tasks_file) }}"

    - name: Assert deploy playbook targets the app group and wires both roles
      ansible.builtin.assert:
        that:
          - "'hosts: app' in deploy_content"
          - "'- k8s' in deploy_content"
          - "'- app' in deploy_content"
          - "'- docker' not in deploy_content"
        success_msg: "deploy.yml targets hosts: app with roles k8s + app"
        fail_msg: "deploy.yml must target hosts: app and include the k8s and app roles (not docker)"

    - name: Assert k8s role verifies kubectl, terraform, and cluster access
      ansible.builtin.assert:
        that:
          - "'kubectl version --client' in k8s_tasks_content"
          - "'terraform version' in k8s_tasks_content"
          - "'kubectl cluster-info' in k8s_tasks_content"
        success_msg: "k8s role checks kubectl, terraform, and cluster connectivity"
        fail_msg: "roles/k8s/tasks/main.yml must verify kubectl, terraform, and kubectl cluster-info"

    - name: Assert app role applies Terraform and waits for the rollout
      ansible.builtin.assert:
        that:
          - "'terraform init' in app_tasks_content"
          - "'terraform apply' in app_tasks_content"
          - "'TF_VAR_postgres_password' in app_tasks_content"
          - "'TF_VAR_secret_key' in app_tasks_content"
          - "'kubectl rollout status' in app_tasks_content"
          - "'docker compose' not in app_tasks_content"
        success_msg: "app role runs terraform init/apply with TF_VAR_* and waits for rollout"
        fail_msg: "roles/app/tasks/main.yml must run terraform apply (no docker compose) and wait for kubectl rollout"

    - name: Assert inventory structure
      ansible.builtin.assert:
        that:
          - "'app' in groups"
          - "'local' in groups"
          - "groups['app'] | length >= 1"
          - "groups['app'][0] == 'app-server'"
        success_msg: "inventory defines the app and local groups as contracted"
        fail_msg: "inventory must define group app (host app-server) and group local"
