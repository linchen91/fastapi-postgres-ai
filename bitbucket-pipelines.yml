image: hashicorp/terraform:1.9.5

definitions:
  caches:
    terraform: terraform/.terraform
    npm: ~/.npm

pipelines:
  default:
    - step:
        name: Terraform fmt, validate & test
        image: hashicorp/terraform:1.9.5
        caches:
          - terraform
        script:
          - apk add --no-cache bash
          - chmod +x scripts/test-terraform.sh
          - ./scripts/test-terraform.sh
    - step:
        name: Helm chart lint & template
        image: alpine/helm:3.16.4
        script:
          - chmod +x scripts/test-helm.sh
          - ./scripts/test-helm.sh
    - step:
        name: Ansible lint, syntax-check & tests
        image: python:3.12-slim
        script:
          - pip install --quiet ansible-core ansible-lint
          - chmod +x scripts/test-ansible.sh
          - ./scripts/test-ansible.sh
    - step:
        name: Frontend e2e (Playwright)
        # Image version must match @playwright/test in frontend/package.json (1.63.0)
        # so the preinstalled Chromium matches the npm package.
        image: mcr.microsoft.com/playwright:v1.63.0-noble
        caches:
          - npm
        script:
          - cd frontend
          - npm ci
          - npm run test:e2e
        artifacts:
          - frontend/test-results/**
          - frontend/playwright-report/**
