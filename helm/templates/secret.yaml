apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastapi-postgres-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secret.postgresUser is required" .Values.secret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword is required" .Values.secret.postgresPassword | quote }}
  SECRET_KEY: {{ required "secret.secretKey is required" .Values.secret.secretKey | quote }}
  OPENROUTER_API_KEY: {{ required "secret.openrouterApiKey is required" .Values.secret.openrouterApiKey | quote }}
  OPENROUTER_URL: {{ .Values.secret.openrouterUrl | quote }}
  OPENROUTER_MODEL: {{ .Values.secret.openrouterModel | quote }}
  TAVILY_API_KEY: {{ required "secret.tavilyApiKey is required" .Values.secret.tavilyApiKey | quote }}
